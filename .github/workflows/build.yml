name: Build Mednafen

on:
  push:
    branches:
      - main
      - gdb
  pull_request:

jobs:
  build-linux:
    runs-on: ubuntu-latest

    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Checkout repository (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            binutils-dev \
            ccache \
            libasound2-dev \
            libflac-dev \
            libgl1-mesa-dev \
            libsdl2-dev \
            pkg-config \
            zlib1g-dev

      - name: Restore ccache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: ${{ runner.os }}-ccache-${{ github.ref_name }}-${{ hashFiles('CMakeLists.txt', 'CMakePresets.json', 'src/**', 'include/**') }}
          restore-keys: |
            ${{ runner.os }}-ccache-${{ github.ref_name }}-
            ${{ runner.os }}-ccache-

      - name: Configure ccache
        run: |
          mkdir -p ~/.cache/ccache
          ccache --set-config=cache_dir=$HOME/.cache/ccache
          ccache --set-config=max_size=750M
          ccache --zero-stats

      - name: Configure debug build
        run: cmake --preset debug -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

      - name: Build executable
        run: cmake --build --preset debug --target mednafen

      - name: Show ccache stats
        run: ccache --show-stats

      - name: Upload executable
        uses: actions/upload-artifact@v4
        with:
          name: mednafen-linux
          path: build/mednafen

  build-win32:
    runs-on: ubuntu-latest

    container:
      image: registry.gitlab.com/ced2911/mednafen-saturn-dev:latest

    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Checkout repository (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Create build directory
        run: |
          mkdir build
          cd build
          export PATH="/opt/mxe-w64/usr/bin/:$PATH"
          x86_64-w64-mingw32.static-cmake .. -DWINDOWS=1 -DMDFN_ENABLE_DEV_BUILD=1 -DWANT_DEBUGGER=1 -DCMAKE_BUILD_TYPE=Debug 
          make
          x86_64-w64-mingw32.static-strip mednafen.exe -o ../mednafen.exe

      - name: Upload executable
        uses: actions/upload-artifact@v4
        with:
          name: mednafen.exe
          path: mednafen.exe
